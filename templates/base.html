<!DOCTYPE html>
<html lang="pl" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Air Quality{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/bootstrap.css') }}">

    {% for name in ['base', 'navbar', 'home', 'form', 'results',
                    'components', 'history', 'delete', 'footer', 'responsive'] %}
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/' ~ name ~ '.css') }}">
    {% endfor %}

    <script src="{{ url_for('static', filename='javascript/bootstrap.js') }}" defer></script>
    <script src="{{ url_for('static', filename='javascript/script.js') }}" defer></script>
</head>

<body>

    <nav class="navbar-custom">
        <a href="{{ url_for('url_routes.main_page') }}" class="brand">
            <span class="brand-icon">◉</span>
            Air<span>Quality</span>
        </a>

        <div class="nav-links">
            <a href="{{ url_for('url_routes.main_page') }}">Strona główna</a>
            <a href="{{ url_for('url_routes.aq_history') }}">Historia pomiarów</a>
        </div>
    </nav>

    <main class="page-container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>AirQuality Dashboard <span>·</span> Dane o jakości powietrza</p>
    </footer>

</body>
</html>
